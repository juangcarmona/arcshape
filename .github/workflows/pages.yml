name: Publish ArcShape engineering portal

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "docs/architecture/**"
      - "docs/product/model/**"
      - "src/engineering-portal/**"
      - "src/public-site/**"
      - "scripts/add-source-provenance.mjs"
      - "scripts/build-engineering-portal.mjs"
      - "scripts/validate-public-site.mjs"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "docs/architecture/**"
      - "docs/product/model/**"
      - "src/engineering-portal/**"
      - "src/public-site/**"
      - "scripts/add-source-provenance.mjs"
      - "scripts/build-engineering-portal.mjs"
      - "scripts/validate-public-site.mjs"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Assurance]
    types: [completed]
  workflow_dispatch:
    inputs:
      remove_e2e_summary:
        description: Remove the public E2E summary from the next Pages publication
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build engineering portal
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != '' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Download latest completed main Assurance summary
        if: inputs.remove_e2e_summary != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .e2e-carry-forward .e2e-latest
          curl --fail --silent --show-error https://juangcarmona.github.io/arcshape/e2e/latest/summary.json --output .e2e-carry-forward/summary.json || true
          run_record="$(gh api "repos/$GH_REPO/actions/workflows/assurance.yml/runs?branch=main&status=completed&per_page=1" --jq 'if .workflow_runs[0] then [.workflow_runs[0].id, .workflow_runs[0].completed_at, .workflow_runs[0].head_sha] | @tsv else "\t\t" end' || true)"
          IFS=$'\t' read -r run_id completed_at source_commit <<< "$run_record"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          if test -n "$run_id"; then gh run download "$run_id" --repo "$GH_REPO" --name arcshape-public-e2e-summary --dir .e2e-latest || true; fi
        id: assurance
      - name: Generate Product Snapshot
        run: |
          npx --no-install prodshape graph --format html
          mkdir -p _site/model
          cp .product/generated/snapshot.html _site/model/index.html
          node scripts/add-source-provenance.mjs _site/model/index.html "${{ steps.revision.outputs.sha }}" docs/product/model
      - name: Generate Architecture Snapshot
        run: |
          mkdir -p _site/architecture
          node packages/cli/src/bin/arcshape.mjs site build --out _site/architecture/index.html --title ArcShape --source-ref "${{ steps.revision.outputs.sha }}"
      - name: Assemble and validate portal
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          SELECTED_RUN_ID: ${{ steps.assurance.outputs.run_id }}
          SELECTED_COMPLETED_AT: ${{ steps.assurance.outputs.completed_at }}
          SELECTED_SOURCE_COMMIT: ${{ steps.assurance.outputs.source_commit }}
          DISABLE_E2E_SUMMARY: ${{ inputs.remove_e2e_summary }}
        run: node scripts/build-engineering-portal.mjs --out _site
      - name: Validate public-site source
        run: node scripts/validate-public-site.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy engineering portal
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
