name: Publish ArcShape reader site

on:
  pull_request:
    branches: [main]
    paths:
      - "bin/**"
      - "docs/architecture/**"
      - "package-lock.json"
      - "package.json"
      - "tools/arc42-site/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "docs/architecture/**"
      - "package-lock.json"
      - "package.json"
      - "tools/arc42-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build reader site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate reader site
        run: node bin/arcshape.mjs site build --out _site/index.html --title ArcShape --source-ref main
      - name: Verify generated site
        run: test -s _site/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy reader site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
