name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install npm runtime for reproducible SBOM generation
        run: npm install --global npm@10.9.9
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-version.mjs
      - name: Generate SBOM from the release package
        run: bash scripts/generate-release-sbom.sh "$RUNNER_TEMP/arcshape-sbom"
      - name: Enforce runtime transitive license policy
        run: |
          sbom_file=$(find "$RUNNER_TEMP/arcshape-sbom" -maxdepth 1 -type f -name '*.cdx.json' -print -quit)
          test -n "$sbom_file"
          node scripts/check-license-policy.mjs "$sbom_file"
      - name: Retain verified release SBOM
        uses: actions/upload-artifact@v7
        with:
          name: arcshape-release-sbom-${{ github.event.release.tag_name }}
          path: ${{ runner.temp }}/arcshape-sbom/*.cdx.json
          retention-days: 90

  publish:
    name: Publish reviewed release
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-version.mjs
      - name: Download verified release SBOM
        uses: actions/download-artifact@v7
        with:
          name: arcshape-release-sbom-${{ github.event.release.tag_name }}
          path: ${{ runner.temp }}/arcshape-sbom
      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/upload-release-sbom.mjs "$RUNNER_TEMP/arcshape-sbom" "$RELEASE_TAG"
      - run: npm publish --provenance --access public
      - name: Verify published registry version
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name }}
        run: node scripts/verify-published-version.mjs
