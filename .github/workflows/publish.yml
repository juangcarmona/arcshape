name: Release

# Versioning is prepared by Changesets after feature PRs merge to main. npm
# publication happens only from the reviewed Version Packages commit or the
# explicit recovery dispatch; creating a GitHub Release is a later idempotent
# evidence step in this same workflow and cannot trigger a second publisher.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Release operation
        type: choice
        required: true
        default: publish-current-stable
        options:
          - publish-current-stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Resolve the release train before a protected publish job is considered.
  release-mode:
    name: Determine release mode
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.event.inputs.task }}" = "publish-current-stable" ]; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          elif [ -f .changeset/pre.json ]; then
            echo "mode=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          fi

  version-pr:
    name: Maintain Version Packages PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: npm run version
          commit: "chore(release): version packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"

  publish-stable:
    name: Publish stable release
    needs: release-mode
    if: >-
      (github.event_name == 'push' && needs.release-mode.outputs.mode == 'stable' && (startsWith(github.event.head_commit.message, 'chore(release): version packages') || startsWith(github.event.head_commit.message, 'Version Packages'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'publish-current-stable' && needs.release-mode.outputs.mode == 'stable')
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Install npm runtime for reproducible SBOM generation
        run: npm install --global npm@10.9.9
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run security:audit
      - name: Generate release SBOM
        run: bash scripts/generate-release-sbom.sh "$RUNNER_TEMP/arcshape-sbom"
      - name: Enforce runtime transitive license policy
        run: |
          sbom_file=$(find "$RUNNER_TEMP/arcshape-sbom" -maxdepth 1 -type f -name '*.cdx.json' -print -quit)
          test -n "$sbom_file"
          node scripts/check-license-policy.mjs "$sbom_file"
      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      # Match ProductShape: Changesets decides which committed package versions need publishing.
      # This also handles valid prerelease entries already present in the npm registry.
      - name: Publish committed packages
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Verify published registry version
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/cli/package.json', 'utf8')).version") \
            node scripts/verify-published-version.mjs
      - name: Resolve release evidence commit
        id: release-context
        run: |
          git fetch --tags --force origin
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/cli/package.json', 'utf8')).version")
          package_tag="@arcshape/cli@${version}"
          github_tag="v${version}"
          release_commit=""
          for candidate in "$package_tag" "$github_tag"; do
            if git rev-parse --verify "refs/tags/${candidate}^{commit}" >/dev/null 2>&1; then
              release_commit=$(git rev-list -n 1 "refs/tags/${candidate}")
              break
            fi
          done
          release_commit=${release_commit:-$(git rev-parse HEAD)}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package_tag=${package_tag}" >> "$GITHUB_OUTPUT"
          echo "github_tag=${github_tag}" >> "$GITHUB_OUTPUT"
          echo "release_commit=${release_commit}" >> "$GITHUB_OUTPUT"
          echo "Release evidence commit: ${release_commit}"
      - name: Synchronize package tag
        env:
          PACKAGE_TAG: ${{ steps.release-context.outputs.package_tag }}
          RELEASE_COMMIT: ${{ steps.release-context.outputs.release_commit }}
          HUSKY: "0"
        run: |
          tag="$PACKAGE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Package tag ${tag} already exists."
          else
            if ! git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
              git tag "${tag}" "$RELEASE_COMMIT" -m "${tag}"
            fi
            git push origin "refs/tags/${tag}"
          fi
          test "$(git rev-list -n 1 "refs/tags/${tag}")" = "$RELEASE_COMMIT"
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null
      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TAG: ${{ steps.release-context.outputs.github_tag }}
          RELEASE_COMMIT: ${{ steps.release-context.outputs.release_commit }}
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/cli/package.json', 'utf8')).version")
          if gh release view "$GITHUB_TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_TAG} already exists."
          else
            node scripts/release-notes.mjs > "$RUNNER_TEMP/arcshape-release-notes.md"
            gh release create "$GITHUB_TAG" --target "$RELEASE_COMMIT" --title "ArcShape ${version}" --notes-file "$RUNNER_TEMP/arcshape-release-notes.md" --generate-notes
          fi
          git fetch --tags --force origin
          RELEASE_TAG="$GITHUB_TAG" RELEASE_COMMIT="$RELEASE_COMMIT" node scripts/verify-release-version.mjs
      - name: Attach verified SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/cli/package.json', 'utf8')).version")
          node scripts/upload-release-sbom.mjs "$RUNNER_TEMP/arcshape-sbom" "v${version}"
